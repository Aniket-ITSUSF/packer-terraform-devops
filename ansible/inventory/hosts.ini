[amazon]
amazon-01 ansible_host=<YOUR PRIVATE IP>
amazon-02 ansible_host=<YOUR PRIVATE IP>
amazon-03 ansible_host=<YOUR PRIVATE IP>

[ubuntu]
ubuntu-01 ansible_host=<YOUR PRIVATE IP>
ubuntu-02 ansible_host=<YOUR PRIVATE IP>
ubuntu-03 ansible_host=<YOUR PRIVATE IP>

[amazon:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/ami-pair.pem

[ubuntu:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/ami-pair.pem
