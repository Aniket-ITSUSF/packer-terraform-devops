cat > ~/ansible/inventory/hosts.ini << 'EOF'
[amazon]
amazon-01 ansible_host=10.0.1.73
amazon-02 ansible_host=10.0.1.68
amazon-03 ansible_host=10.0.1.6

[ubuntu]
ubuntu-01 ansible_host=10.0.1.233
ubuntu-02 ansible_host=10.0.1.25
ubuntu-03 ansible_host=10.0.1.167

[amazon:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/ami-pair.pem

[ubuntu:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/ami-pair.pem
EOF
